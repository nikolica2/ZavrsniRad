<!-- Navbar wrapper -->
<div class="bg-white border border-gray-200 rounded-xl overflow-hidden mb-6">
  <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-wrap gap-3">
    <h1 class="text-xl font-medium text-blue-600">{{ title }}</h1>

    <nav class="flex gap-1">
      <a
        routerLink="/projects"
        class="px-3.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors"
      >
        Projekti
      </a>
      <a
        routerLink="/my-projects"
        class="px-3.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors"
      >
        Moji projekti
      </a>
      <a
        routerLink="/profile"
        class="px-3.5 py-1.5 rounded-lg text-sm text-gray-500 hover:bg-gray-100 hover:text-gray-900 transition-colors"
      >
        Profil
      </a>
    </nav>
  </div>
</div>

<!-- ovdje je dizajn za tablicu korisnika koja prikazuje sve članove koju treba samo admin imati pristup, ali to ćemo kasnije implementirati. Trenutno je samo dizajn. 
 Takoder, triba request iz app.ts pribacit u posebnu komponentu koja displaya korisnike-->
<div class="bg-white border border-gray-200 rounded-xl overflow-hidden mb-6">
  <!-- Header -->
  <div class="grid grid-cols-[60px_1fr_1fr] px-5 py-2.5 border-b border-gray-100">
    <span class="text-xs text-gray-400 font-medium">#</span>
    <span class="text-xs text-gray-400 font-medium">Ime</span>
    <span class="text-xs text-gray-400 font-medium">Email</span>
  </div>

  <!-- Rows -->
  @for (member of members(); track member.id) {
    <div
      class="grid grid-cols-[60px_1fr_1fr] px-5 py-3 items-center border-b border-gray-100 last:border-0 hover:bg-gray-50 transition-colors"
    >
      <span class="text-sm text-gray-400">{{ member.id }}</span>

      <div class="flex items-center gap-2.5">
        <div
          class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-xs font-medium text-blue-700 shrink-0"
        >
          {{ getInitials(member.displayName) }}
        </div>
        <span class="text-sm text-gray-900">{{ member.displayName }}</span>
      </div>

      <span class="text-sm text-gray-500">{{ member.email }}</span>
    </div>
  }
</div>

<router-outlet />
