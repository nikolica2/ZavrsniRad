<div class="min-h-screen bg-gray-50 flex items-center justify-center">
  <div class="bg-white border border-gray-200 rounded-xl p-8 w-full max-w-sm">
    <h2 class="text-xl font-medium text-gray-900 mb-6">Registracija</h2>

    <div class="flex flex-col gap-4">
      <div>
        <label class="text-sm text-gray-500 mb-1 block">Ime</label>
        <input
          type="text"
          [(ngModel)]="displayName"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="Ime Prezime"
        />
      </div>

      <div>
        <label class="text-sm text-gray-500 mb-1 block">Email</label>
        <input
          type="email"
          [(ngModel)]="email"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="email@primjer.com"
        />
      </div>

      <div>
        <label class="text-sm text-gray-500 mb-1 block">Lozinka</label>
        <input
          type="password"
          [(ngModel)]="password"
          class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-blue-500 transition-colors"
          placeholder="••••••••"
        />
      </div>

      @if (error) {
        <p class="text-sm text-red-500">{{ error }}</p>
      }

      <button
        (click)="onRegister()"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors w-full"
      >
        Registriraj se
      </button>

      <p class="text-sm text-gray-400 text-center">
        Već imaš račun?
        <a routerLink="/login" class="text-blue-600 hover:underline">Prijavi se</a>
      </p>
    </div>
  </div>
</div>
